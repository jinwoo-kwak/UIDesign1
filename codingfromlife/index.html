<!DOCTYPE html>
<html lang="en">
<head>
  <title>Coding from Life: CSS Still Life</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/main.css?v=vkhutemas-still-life" type="text/css" />
</head>
<body>
  <a class="back-home" href="../index.html">BACK TO PORTFOLIO</a>

  <main id="align">
    <section id="stage" aria-label="A CSS still life of Soviet-era architect and designer tools">
      <div class="poster-lines" aria-hidden="true"></div>
      <div class="red-plane" aria-hidden="true"></div>
      <div class="black-plane" aria-hidden="true"></div>
      <div class="table-plane" aria-hidden="true"></div>

      <div class="blueprint object" aria-hidden="true">
        <div class="plan-grid"></div>
        <div class="plan-core"></div>
        <div class="plan-wing wing-a"></div>
        <div class="plan-wing wing-b"></div>
        <div class="plan-tower"></div>
        <div class="plan-axis axis-a"></div>
        <div class="plan-axis axis-b"></div>
        <div class="plan-label">ВХУТЕМАС / 1920</div>
      </div>

      <div class="scale-ruler object" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="triangle object" aria-hidden="true">
        <div class="triangle-hole"></div>
      </div>

      <div class="compass object" aria-hidden="true">
        <div class="joint"></div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
        <div class="needle"></div>
      </div>

      <div class="pencil object" aria-hidden="true">
        <div class="pencil-body"></div>
        <div class="pencil-point"></div>
        <div class="pencil-end"></div>
      </div>

      <div class="ink object" aria-hidden="true">
        <div class="ink-cap"></div>
        <div class="ink-neck"></div>
        <div class="ink-body"></div>
        <div class="ink-label">Чернил</div>
      </div>

      <div class="paper-roll object" aria-hidden="true">
        <div class="roll-face"></div>
      </div>

      <div class="model-blocks object" aria-hidden="true">
        <div class="block block-red"></div>
        <div class="block block-black"></div>
        <div class="block block-yellow"></div>
      </div>

      <div class="caption">
        <span><strong>Искусство В Жизнь!</strong></span>
      </div>
    </section>
  </main>
</body>
</html>
